<VirtualHost *:80>
 ServerName localhost
 DocumentRoot /var/www/html
 <Directory /var/www/html>
  Options -Indexes -FollowSymLinks
  AllowOverride All
  Require all granted
 </Directory>
 <Directory /var/www/html/core>
  Require all denied
 </Directory>
 <Directory /var/www/html/install>
  Require all denied
 </Directory>
 <FilesMatch "^(\.env|composer\.(json|lock)|artisan|.*\.(sql|log|bak))$">
  Require all denied
 </FilesMatch>
 ErrorLog /proc/self/fd/2
 CustomLog /proc/self/fd/1 combined
</VirtualHost>
